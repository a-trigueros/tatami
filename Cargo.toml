[package]
name = "tatami"
version = "0.2.0"
edition = "2024"
description = "Worktrunk-style workspace manager for the jujutsu (jj) VCS"
license = "MIT"
repository = "https://github.com/a-trigueros/tatami"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
home = "0.5"
minijinja = "3.1.0"
ignore = "0.4.34"
petname = "3.2.0"
dunce = "1.0.5"

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"

[lints.rust]
warnings = "deny"
