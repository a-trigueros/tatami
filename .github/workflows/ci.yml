name: CI

on: [push, pull_request]

env:
  # Keep in sync with the local jj used to pin adapter contracts (integration
  # tests characterize real jj behavior). Bump together.
  JJ_VERSION: v0.47.1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install jj ${{ env.JJ_VERSION }}
        # Authenticated download: anonymous release-asset fetches from the
        # runners' shared IP ranges are rate-limited and fail instantly.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$JJ_VERSION" --repo jj-vcs/jj \
            --pattern "jj-*-x86_64-unknown-linux-musl.tar.gz" \
            --output /tmp/jj.tar.gz --clobber
          # Extract into a dedicated directory: the tarball carries a `./`
          # entry whose sticky-bit mode/utime tar would try to apply to the
          # extraction root itself — denied on the shared /tmp.
          mkdir -p /tmp/jj-install
          tar -xzf /tmp/jj.tar.gz -C /tmp/jj-install
          sudo mv /tmp/jj-install/jj /usr/local/bin/jj
          jj --version
      # The shell-integration proofs run real zsh (bash is preinstalled).
      - run: sudo apt-get update && sudo apt-get install -y zsh
      # Full suite: fast tier + integration tests against real jj.
      - run: cargo test

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Fast tier only: no verified aarch64 asset name for the musl-style
      # direct download; the Linux job proves the jj contracts.
      - run: cargo test --lib
