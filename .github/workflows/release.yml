name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl build: runs anywhere glibc-free (Alpine, containers…).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          # Both darwin targets build on the arm64 runner: the macOS SDK is
          # universal, so cross-compiling x86_64 needs no extra toolchain.
          # (The macos-13 Intel runners are deprecated and queue forever.)
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          # EXPERIMENTAL: binary only — no shell integration (the tt wrapper
          # is zsh/bash); integration tests do run on Windows in CI.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: tatami.exe
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools (linux-musl only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          BIN="${{ matrix.bin }}"
          BIN="${BIN:-tatami}"
          NAME="tatami-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$NAME"
          cp "target/${{ matrix.target }}/release/$BIN" "$NAME/"
          cp README.md LICENSE "$NAME/"
          tar -czf "$NAME.tar.gz" "$NAME"
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            tatami-*.tar.gz
            tatami-*.tar.gz.sha256

  release:
    needs: build
    # workflow_dispatch (no tag) only proves the builds; no release without a tag.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          # Re-runs may find a partial release from a cancelled earlier attempt.
          gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            dist/*
